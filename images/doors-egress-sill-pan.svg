<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 338" width="900" height="338" role="img" aria-label="Section through the door sill showing the sill pan and sealant" xmlns:c2pa="http://c2pa.org/manifest"><title>Section through the door sill showing the sill pan and sealant</title><style>:root{
  --paper:#eef1f4; --sheet:#ffffff; --ink:#1b2430; --ink2:#566273; --rule:#d3d9e1;
  --block:#e6e9ed; --hatch:#98a2b0; --pt:#d4e1c3; --ptline:#5d7843; --wood:#f0e4cd; --woodline:#94764a;
  --zip:#7aa970; --zipdot:#3f6a37; --membrane:#3d4b6e; --pvc:#ffffff; --metal:#8b96a3; --tape:#d99a2b;
  --accent:#1f56a8; --warn:#a8321f; --slab:#dde5ef; --siding:#eceff2;
  --f-label:"Arial Narrow", "Arial Narrow", Arial, sans-serif;
  --f-body:"Arial", "Segoe UI", Roboto, Arial, sans-serif;
}
svg { display:block; width:100%; height:auto; margin:0 auto; min-width:560px; background:color-mix(in srgb, var(--sheet) 88%, transparent); }
svg text.lbl { font-family:var(--f-label); font-size:12.5px; fill:var(--ink); }
svg text.side { font-family:var(--f-label); font-size:11px; letter-spacing:.14em; fill:var(--ink2); font-weight:600; }
svg .leader { fill:none; stroke:var(--accent); stroke-width:1; }
svg .dot { fill:var(--accent); }
svg .blockface { fill:var(--block); stroke:var(--ink2); stroke-width:1; }
svg .joint { stroke:var(--hatch); stroke-width:.8; }
svg .lintel { fill:var(--metal); stroke:var(--ink); stroke-width:.8; stroke-dasharray:4 3; opacity:.55; }
svg .cutout { fill:var(--sheet); stroke:var(--ink); stroke-width:1.2; }
svg .ptface { fill:var(--pt); stroke:var(--ptline); stroke-width:1; }
svg .frame { fill:var(--pvc); stroke:var(--ink); stroke-width:1; }
svg .slab { fill:var(--slab); stroke:var(--ink); stroke-width:1; }
svg .panel { fill:none; stroke:var(--ink2); stroke-width:.8; }
svg .knob { fill:var(--metal); stroke:var(--ink); stroke-width:.8; }
svg .shim { fill:var(--wood); stroke:var(--woodline); stroke-width:.8; }
svg .casing, svg .casingsec { fill:var(--pvc); stroke:var(--ink); stroke-width:1.2; }
svg .ghost { fill:none; stroke:var(--ink2); stroke-width:1; stroke-dasharray:5 4; }
svg .ghostpt { fill:var(--pt); fill-opacity:.35; stroke:var(--ptline); stroke-width:1; stroke-dasharray:5 4; }
svg .metal { fill:var(--metal); stroke:var(--ink); stroke-width:.6; }
svg .metalsec { fill:var(--metal); stroke:var(--ink); stroke-width:.6; }
svg .sealant { stroke:var(--tape); stroke-width:2.5; }
svg .sealdot { fill:var(--tape); stroke:var(--ink); stroke-width:.6; }
svg .grade { stroke:var(--ink); stroke-width:1.6; }
svg .blocksec { fill:url(#hatchBlock); stroke:var(--ink); stroke-width:1.2; }
svg .grout { fill:url(#hatchGrout); stroke:var(--ink2); stroke-width:.6; }
svg .hb-bg { fill:var(--block); }
svg .hb-ln { stroke:var(--hatch); stroke-width:1.2; }
svg .wood { fill:var(--wood); stroke:var(--woodline); stroke-width:1; }
svg .pt { fill:var(--pt); stroke:var(--ptline); stroke-width:1; }
svg .woodx { stroke:var(--ptline); stroke-width:.5; opacity:.6; }
svg .drywall { fill:var(--siding); stroke:var(--ink2); stroke-width:.8; }
svg .sealer { stroke:var(--accent); stroke-width:2; stroke-dasharray:2 2; }
svg .screw { stroke:var(--ink); stroke-width:1.4; }
svg .slabsec { fill:var(--slab); stroke:var(--ink); stroke-width:1; }
svg .floorbg { fill:var(--siding); stroke:none; }
svg .subfloor { fill:var(--wood); stroke:var(--woodline); stroke-width:.8; }
svg .wrb { stroke:var(--accent); stroke-width:1.6; stroke-dasharray:6 3; }
svg .siding { fill:var(--siding); stroke:var(--ink); stroke-width:.9; }
svg .sidingface { fill:var(--siding); stroke:var(--ink2); stroke-width:1; }
svg .lap { stroke:var(--ink2); stroke-width:.8; }
svg .zip { fill:url(#zipTex); stroke:var(--zipdot); stroke-width:1; }
svg .zip-bg { fill:var(--zip); }
svg .zip-dot { fill:var(--zipdot); }
svg .tape { fill:var(--tape); stroke:none; }
svg .membrane { fill:var(--membrane); stroke:var(--membrane); stroke-width:1.2; }
svg .split { stroke:var(--accent); stroke-width:1.4; stroke-dasharray:7 5; }
svg .grain { stroke:var(--ptline); stroke-width:.6; opacity:.7; }
svg .stud { fill:var(--pt); stroke:var(--ptline); stroke-width:1; }
svg .pan { fill:none; stroke:var(--membrane); stroke-width:3.5; stroke-linejoin:round; }
svg .sillprof { fill:var(--metal); stroke:var(--ink); stroke-width:1; fill-opacity:.55; }
svg .sweep { fill:var(--ink2); stroke:none; }
svg .bead { stroke:var(--tape); stroke-width:2.6; stroke-linecap:round; stroke-dasharray:0.1 5; }
svg .ext { stroke:var(--ink2); stroke-width:.7; stroke-dasharray:3 3; }
svg .tick { stroke:var(--ink); stroke-width:1.2; }
svg .dim { stroke:var(--ink); stroke-width:.9; }
svg text.dimtxt { font-family:var(--f-label); font-size:12px; fill:var(--ink); paint-order:stroke; stroke:var(--sheet); stroke-width:5px; stroke-linejoin:round; }
svg text.lbl{font-size:12px}</style><defs>
<pattern id="hatchBlock" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" class="hb-bg"/><line x1="0" y1="0" x2="0" y2="7" class="hb-ln"/></pattern>
<pattern id="hatchGrout" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" class="hb-bg"/><line x1="0" y1="0" x2="0" y2="4" class="hb-ln"/></pattern>
<pattern id="zipTex" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" class="zip-bg"/><circle cx="3" cy="3" r="0.8" class="zip-dot"/></pattern>
</defs><rect x="0" y="0" width="900" height="338" fill="#ffffff"/><rect x="230" y="214" width="132" height="110" class="slabsec" /><rect x="362" y="214" width="167.75" height="110" class="blocksec" /><rect x="529.75" y="302.0" width="140.25" height="22.0" class="slabsec" /><line x1="230" y1="214" x2="362" y2="214" class="grade"/><rect x="359.8" y="82" width="172.15" height="132" class="ghost" /><polyline points="359.8,192.0 359.8,214 532.39,214 532.39,236.0" class="pan"/><circle cx="381.8" cy="209.16" r="5" class="sealdot"/><circle cx="414.8" cy="209.16" r="5" class="sealdot"/><polygon points="366.4,204.32 542.95,204.32 542.95,195.3 410.4,178.8 366.4,178.8" class="sillprof"/><rect x="381.8" y="30.3" width="38.5" height="145.2" class="slab" /><rect x="388.4" y="173.3" width="25.3" height="5.5" class="sweep" /><line x1="230" y1="213.56" x2="362" y2="213.56" class="grade"/><text x="238.8" y="306.4" class="side">INSIDE</text><text x="661.2" y="306.4" text-anchor="end" class="side">OUTSIDE</text><polyline points="220,113.5 222,113.5 360.9,115.0" class="leader"/><circle cx="360.9" cy="115.0" r="2.6" class="dot"/><text x="216" y="111.0" text-anchor="end" class="lbl"><tspan x="216" dy="0">Ends turned up 6&quot; at</tspan><tspan x="216" dy="13">each jamb (dashed, behind)</tspan></text><polyline points="220,194.9 222,194.9 359.8,196.4" class="leader"/><circle cx="359.8" cy="196.4" r="2.6" class="dot"/><text x="216" y="192.4" text-anchor="end" class="lbl"><tspan x="216" dy="0">Back dam turned up</tspan><tspan x="216" dy="13">on the inside</tspan></text><polyline points="220,225.9 222,225.9 398.3,209.16" class="leader"/><circle cx="398.3" cy="209.16" r="2.6" class="dot"/><text x="216" y="223.4" text-anchor="end" class="lbl"><tspan x="216" dy="0">Sealant under the sill and</tspan><tspan x="216" dy="13">jamb legs, back half only</tspan></text><polyline points="680,91.5 678,91.5 401.6,93.0" class="leader"/><circle cx="401.6" cy="93.0" r="2.6" class="dot"/><text x="684" y="95.5" text-anchor="start" class="lbl"><tspan x="684" dy="0">Door</tspan></text><polyline points="680,190.5 678,190.5 472,192.0" class="leader"/><circle cx="472" cy="192.0" r="2.6" class="dot"/><text x="684" y="188.0" text-anchor="start" class="lbl"><tspan x="684" dy="0">Door sill sits in a</tspan><tspan x="684" dy="13">bed of sealant on the pan</tspan></text><polyline points="680,228.0 678,228.0 532.39,227.2" class="leader"/><circle cx="532.39" cy="227.2" r="2.6" class="dot"/><text x="684" y="219.0" text-anchor="start" class="lbl"><tspan x="684" dy="0">Front lip turned down</tspan><tspan x="684" dy="13">over the face, left open</tspan><tspan x="684" dy="13">so the pan can drain</tspan></text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>